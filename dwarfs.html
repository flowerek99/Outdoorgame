<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        
        <div class="description-frame">
            <h1>###</h1>
            <p>
               
            </p>
        </div>

        <div class="scroll-down">↓</div>

        <div class="puzzle-section" id="zagadka">
            <h2>Your task:</h2>
            <div class="copy-container">
                <p id="task-text">###</p>
                <div class="copy-action-wrapper">
                    <button class="copy-btn" onclick="copyTaskText()">Copy</button>
                    <span id="copy-feedback" class="copy-feedback">Copied!</span>
                </div>
            </div>
        </div>

        <div class="checker-section">
            <h3>Check your answer</h3>
            <input type="text" id="answer-input" autocomplete="off">
            <br>
            <button onclick="checkAnswer()">Submit</button>

            <div id="error-box" class="message error-msg">Unfortunately, that is not the correct answer. Keep trying!</div>
            
            <div id="success-box" class="message success-msg">
                Congrats!<br><br>
                <strong>Next stage:</strong> ###
            </div>
        </div>

    </div>

    <script>
        function copyTaskText() {
            const taskText = document.getElementById("task-text").innerText;
            const feedback = document.getElementById("copy-feedback");

            navigator.clipboard.writeText(taskText).then(() => {
                feedback.style.display = "inline";
                setTimeout(() => {
                    feedback.style.display = "none";
                }, 2000);
            }).catch(err => {
                console.error("Nie udało się skopiować tekstu: ", err);
            });
        }

        function checkAnswer() {
            const correctAnswer = "1801"; 
            const userInput = document.getElementById("answer-input").value.trim().toLowerCase();
            const errorBox = document.getElementById("error-box");
            const successBox = document.getElementById("success-box");

            errorBox.style.display = "none";
            successBox.style.display = "none";

            if (userInput === correctAnswer) {
                successBox.style.display = "block";
            } else {
                errorBox.style.display = "block";
            }
        }
    </script>

</body>
</html>
