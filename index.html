<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outdoor Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            font-size: 14px;
            margin-bottom: 25px;
            color: #7f8c8d;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wpisz Kod Skrytki</h1>
        <p>Znajdź kod w terenie, aby odblokować zagadkę.</p>

        <form id="puzzle-form">
            <input type="text" id="secret-code" placeholder="np. KOD123" autocomplete="off">
            <div id="error-message" class="error-msg">Wpisz kod przed zatwierdzeniem!</div>
            <button type="submit">Sprawdź</button>
        </form>
    </div>

    <script>
        document.getElementById('puzzle-form').addEventListener('submit', function(event) {

            event.preventDefault(); 
            

            let inputField = document.getElementById('secret-code');
            let errorMessage = document.getElementById('error-message');
            

            let code = inputField.value.trim().toLowerCase();

            if (code === "") {
                errorMessage.style.display = "block";
            } else {
                errorMessage.style.display = "none";

                window.location.href = code + ".html";
            }
        });
    </script>

</body>
</html>
